name: e2e

on:
  workflow_dispatch: ~
  schedule:
    - cron: "0 8 */2 * 1-5"
  push:
    branches:
      - main
  pull_request: ~

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      versions: ${{ steps.set.outputs.versions }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - id: set
        working-directory: __tests__/e2e
        run: |
          versions=$(node scripts/resolve_versions.js --json)
          echo "versions=$versions" >> "$GITHUB_OUTPUT"

  # Keep compatibility-version E2E failures visible without blocking merges.
  test:
    needs: prepare
    continue-on-error: true
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJson(needs.prepare.outputs.versions) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          cache: npm
          node-version-file: .nvmrc
      - uses: actions/setup-go@v5
        with:
          go-version: 1.21
      - run: npm ci
      - run: npm run build
      - run: npm install
        working-directory: __tests__/e2e
      - run: bash scripts/setup_integration.sh ${{ matrix.version }} && bash scripts/ci_integration.sh ${{ matrix.version }}
        working-directory: __tests__/e2e
        env:
          TERM: xterm # this is needed for tput
      - if: success() || failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.version }}
          path: "**/junit_*.xml"
          if-no-files-found: error

  notify:
    needs: test
    if: always() && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/github-script@v7
        id: summary
        with:
          script: |
            const path = require('path');
            const {
              summarizeTestJobs,
              formatSlackMessage,
            } = require(path.join(
              process.env.GITHUB_WORKSPACE,
              '.github/scripts/summarize_e2e_jobs.js'
            ));
            const jobs = await github.paginate(
              github.rest.actions.listJobsForWorkflowRun,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: context.runId,
                filter: 'latest',
              }
            );
            const message = formatSlackMessage({
              ...summarizeTestJobs(jobs),
              ref: process.env.GITHUB_REF_NAME,
              eventName: context.eventName,
              runNumber: context.runNumber,
              runUrl: `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}/attempts/${process.env.GITHUB_RUN_ATTEMPT}`,
            });
            core.setOutput('message', encodeURIComponent(message));
      - uses: elastic/oblt-actions/slack/send@v1
        with:
          bot-token: ${{ secrets.SLACK_BOT_TOKEN }}
          channel-id: "#synthetics-notify"
          message: ${{ steps.summary.outputs.message }}
