name: ci

on:
  pull_request: ~
  push:
    branches:
      - main

permissions:
  contents: read

jobs:

  lint:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          cache: npm
          node-version-file: .nvmrc
      - run: npm ci
      - run: npm run-script lint
      - run: npm run-script format:check

  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          cache: npm
          node-version-file: .nvmrc
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          if-no-files-found: error

  test-matrix:
    name: test (${{ matrix.node-version }})
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        # .nvmrc (release Node) plus the Node version shipped in the Wolfi Heartbeat / Agent images
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          cache: npm
          node-version: ${{ matrix.node-version }}
      - run: npm ci
      - run: npm run test:unit -- --ci --reporters=default --reporters=jest-junit
      - uses: actions/upload-artifact@v4
        with:
          name: test-results-test-node-${{ matrix.node-version }}
          path: "**/junit.xml"
          if-no-files-found: error

  e2e-test-matrix:
    name: e2e-test (${{ matrix.node-version }})
    needs:
      - build
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        # .nvmrc (release Node) plus the Node version shipped in the Wolfi Heartbeat / Agent images
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          cache: npm
          node-version: ${{ matrix.node-version }}
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - run: npm run test
        timeout-minutes: 10
        working-directory: __tests__/e2e
        env:
          TERM: xterm # this is needed for tput
      - uses: actions/upload-artifact@v4
        with:
          name: test-results-e2e-test-node-${{ matrix.node-version }}
          path: "**/junit.xml"
          if-no-files-found: error

  # Stable check names for branch protection, independent of the Node matrix.
  test:
    if: always()
    needs: test-matrix
    runs-on: ubuntu-22.04
    steps:
      - run: test "${{ needs.test-matrix.result }}" = success

  e2e-test:
    if: always()
    needs: e2e-test-matrix
    runs-on: ubuntu-22.04
    steps:
      - run: test "${{ needs.e2e-test-matrix.result }}" = success
